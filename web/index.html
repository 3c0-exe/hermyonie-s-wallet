<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base URL of your application.
    e.g. for a Flutter Web app at example.com/myapp: <base href="/myapp/">

    It is recommended to not change the base href as it may break Firebase
    authentication and file paths.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- Primary meta -->
  <title>Hermyonie's Wallet</title>
  <meta name="description" content="Your personal pink budget tracker.">
  <meta name="google-signin-client_id" content="282796857388-5o24fa436mvb9g5ajgop0iu0onbfnh0k.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- PWA / theme -->
  <meta name="theme-color" content="#F4A7C0">
  <meta name="background_color" content="#FEF5F7">
  <link rel="manifest" href="manifest.json">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hermyonie's Wallet">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Splash screens for common iPhone sizes -->
  <!-- iPhone 14 Pro Max -->
  <link rel="apple-touch-startup-image"
    media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)"
    href="icons/splash-1290x2796.png">
  <!-- iPhone 14 / 13 / 12 -->
  <link rel="apple-touch-startup-image"
    media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
    href="icons/splash-1170x2532.png">
  <!-- iPhone SE / 8 -->
  <link rel="apple-touch-startup-image"
    media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)"
    href="icons/splash-750x1334.png">

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
  <link rel="shortcut icon" href="icons/favicon.ico">

  <!-- Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- Prevent iOS callouts and selection on tap -->
  <style>
    body {
      margin: 0;
      background-color: #FEF5F7;
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
    }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, sans-serif; color: #632A44; background: #FCF8FA; }
    #loading .mark { font-size: 48px; }
    #loading h1 { font-size: 22px; letter-spacing: -.5px; margin-bottom: 6px; }
    #loading p { color: #756571; font-size: 14px; }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-label="Loading your wallet">
    <div class="mark">♡</div><h1>Hermyonie’s Wallet</h1><p>A little clarity, every day.</p>
  </div>
  <script>
    // Remove legacy Flutter caches, while keeping IndexedDB wallet records intact.
    (async function () {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const reg of registrations) {
            if ((reg.active?.scriptURL || reg.waiting?.scriptURL || '').includes('flutter_service_worker')) await reg.unregister();
          }
        }
        if ('caches' in window) {
          for (const key of await caches.keys()) if (key.startsWith('flutter-')) await caches.delete(key);
        }
      } catch (_) {}
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js'; script.async = true;
      document.body.appendChild(script);
    })();
    window.addEventListener('flutter-first-frame', function () { document.getElementById('loading')?.remove(); });
  </script>
</body>
</html>
